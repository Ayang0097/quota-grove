name: 安装或显示问题 / Bug report
description: 帮助我们复现问题 / Help us reproduce a problem
body:
  - type: markdown
    attributes:
      value: "请勿粘贴完整 Codex 日志、Token 或账号信息。Please redact personal data and credentials."
  - type: input
    id: version
    attributes:
      label: 应用版本 / App version
      placeholder: v1.4.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统与架构 / OS and architecture
      placeholder: macOS 15, Apple Silicon / Windows 11, x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？/ What happened?
      description: 写出操作步骤、预期结果和实际结果，可附打码截图。Include steps, expected and actual behavior, and redacted screenshots.
    validations:
      required: true
  - type: textarea
    id: first-use
    attributes:
      label: 第一次使用卡在哪里？/ Where did you get stuck?
      description: 可选：下载、解压、打开、额度显示，或其他环节。Optional onboarding feedback.
